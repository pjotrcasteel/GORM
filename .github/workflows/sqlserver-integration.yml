name: SQL Server 2022 integration
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'samples/Gorm.Demo/**'
      - 'tests/Gorm.SqlServer.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - '.github/workflows/sqlserver-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker daemon
        run: docker info
      - name: Restore SQL Server integration tests
        run: dotnet restore tests/Gorm.SqlServer.Tests/Gorm.SqlServer.Tests.csproj --configfile NuGet.Config
      - name: Build SQL Server integration tests
        run: dotnet build tests/Gorm.SqlServer.Tests/Gorm.SqlServer.Tests.csproj -c Release --no-restore
      - name: Run SQL Server 2022 integration tests
        run: dotnet test tests/Gorm.SqlServer.Tests/Gorm.SqlServer.Tests.csproj -c Release --no-build --logger "trx;LogFileName=sqlserver-integration.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-integration-results
          path: tests/Gorm.SqlServer.Tests/TestResults/*.trx
          if-no-files-found: ignore
