name: GORM .NET validation
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'Gorm.sln'
      - 'Directory.*.props'
      - 'NuGet.Config'
      - '.github/workflows/build-gorm.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'Gorm.sln'
      - 'Directory.*.props'
      - 'NuGet.Config'
      - '.github/workflows/build-gorm.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Gorm.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build Gorm.sln -c Release --no-restore
      - name: Test
        run: dotnet test Gorm.sln -c Release --no-build
